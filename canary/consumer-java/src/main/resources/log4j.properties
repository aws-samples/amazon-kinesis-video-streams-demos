# Logging config for the storage canary consumer.
#
# Two problems this solves, both visible in the 2026-09-03 soak log:
#
# 1. No wall clock. main() called BasicConfigurator.configure(), whose SimpleLayout prints
#    only milliseconds since JVM start ("59731 [thread] INFO ..."), so correlating a 16.6h
#    consumer log against the viewer log or a CloudWatch graph meant reconstructing time
#    from mCanaryStartTime by hand. ISO8601 in UTC makes the log directly comparable.
#
# 2. Startup noise. amazon-kinesis-video-streams-parser-library-1.2.1.jar ships its own
#    log4j.properties with "log4j.rootLogger = INFO, LAMBDA, CONSOLE", where LAMBDA is
#    com.amazonaws.services.lambda.runtime.log4j.LambdaAppender (not on our classpath) and
#    CONSOLE is never defined. That is the source of the three log4j:ERROR lines
#    ("Could not instantiate class [...LambdaAppender]", "Could not instantiate appender
#    named \"CONSOLE\"") printed before main() even runs. This file shadows it: the runner
#    puts our jar first on `java -classpath` (see storage_runner.groovy /
#    gamma_runner.groovy), and log4j 1.x takes the first log4j.properties it finds.
#
# The resolved backend is reload4j 1.2.18.3 (via slf4j-reload4j, which is what Maven
# substitutes for the slf4j-log4j12 the pom asks for) -- an API-compatible log4j 1.2 fork.
# Hence a 1.x .properties file, not a log4j2 config; the "log4j:ERROR" prefix in the log is
# log4j 1.x's own LogLog output.
log4j.rootLogger=INFO, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
# %d renders in the JVM default timezone; log4j 1.2's PatternLayout takes no timezone
# argument (%d{ISO8601}{UTC} prints a literal "{UTC}" and still uses local time, and
# reload4j has no EnhancedPatternLayout). The runners therefore pass -Duser.timezone=UTC,
# which is what makes these timestamps directly comparable with the viewer log and
# CloudWatch. If you run the consumer by hand without that flag, timestamps are local.
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n

# The AWS SDK logs every request at DEBUG; a multi-day soak does not need that volume.
log4j.logger.com.amazonaws=WARN
